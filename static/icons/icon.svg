<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#14b8a6" stroke-width="6" opacity="0.4" />
  
  <!-- Subtle Medical Cross Behind Heartbeat -->
  <g opacity="0.18">
    <rect x="226" y="110" width="60" height="292" rx="16" fill="#14b8a6" />
    <rect x="110" y="226" width="292" height="60" rx="16" fill="#14b8a6" />
  </g>

  <!-- Pulse Wave Path -->
  <path d="M 80 256 L 160 256 L 195 190 L 230 330 L 270 140 L 315 360 L 350 256 L 432 256"
        fill="none"
        stroke="url(#teal-grad)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Central Pulse Indicator Ring -->
  <circle cx="270" cy="140" r="14" fill="#ffffff" filter="url(#glow)" />
  <circle cx="315" cy="360" r="12" fill="#38bdf8" />
</svg>
